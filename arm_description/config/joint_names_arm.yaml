<?xml version="1.0" ?>
<robot name="arm">
  <!--========== 1. 虚拟关节（world → base_link） ==========-->
  <virtual_joint name="world_joint" type="fixed" parent_frame="world" child_link="base_link"/>

  <!--========== 2. 规划组：整条运动链 ==========-->
  <group name="arm_group" chain="base_link → end_link"/>

  <!--========== 3. 默认零位 ==========-->
  <group_state name="home" group="arm_group">
    <joint name="joint0" value="0"/>
    <joint name="joint1" value="0"/>
    <joint name="joint2" value="0"/>
    <joint name="joint3" value="0"/>
    <joint name="joint4" value="0"/>
    <joint name="joint5" value="0"/>
  </group_state>

  <!--========== 4. 相邻连杆碰撞免检 ==========-->
  <disable_collisions link1="base_link" link2="link0" reason="Adjacent"/>
  <disable_collisions link1="link0"  link2="link1" reason="Adjacent"/>
  <disable_collisions link1="link1"  link2="link2" reason="Adjacent"/>
  <disable_collisions link1="link2"  link2="link3" reason="Adjacent"/>
  <disable_collisions link1="link3"  link2="link4" reason="Adjacent"/>
  <disable_collisions link1="link4"  link2="link5" reason="Adjacent"/>
  <disable_collisions link1="link5"  link2="end_link" reason="Adjacent"/>

  <!--========== 5. 手动关闭容易自碰的连杆对（后续可再调） ==========-->
  <disable_collisions link1="base_link" link2="link1" reason="Never"/>
  <disable_collisions link1="base_link" link2="link2" reason="Never"/>
  <disable_collisions link1="link0"  link2="link2" reason="Never"/>
</robot>